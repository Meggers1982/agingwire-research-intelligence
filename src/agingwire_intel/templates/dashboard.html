<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgingWire Research Intelligence</title>
<style>
  :root { font-family: Inter, system-ui, sans-serif; color: #151515; background: #f5f4ef; }
  body { margin: 0; }
  .wrap { max-width: 1180px; margin: auto; padding: 24px; }
  .hero { display: flex; gap: 16px; align-items: end; justify-content: space-between; flex-wrap: wrap; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 18px; margin: 12px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .metric { font-size: 1.8rem; font-weight: 700; }
  .meta { color: #666; font-size: .9rem; }
  .score { font-size: 1.25rem; font-weight: 800; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag { background: #eee; border-radius: 999px; padding: 4px 8px; font-size: .78rem; }
  .flag { border-radius: 999px; padding: 4px 8px; font-size: .78rem; font-weight: 600; }
  .flag-new { background: #dcefdc; color: #14521c; }
  .flag-gap { background: #e2ecf7; color: #154b7d; }
  .flag-unmonitored { background: #f2ecdc; color: #6b4e12; }
  a { color: #154b7d; }
  input, select { padding: 10px; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  .item h3 { margin-bottom: 6px; }
  .angles { margin-top: 8px; }
  .health-error { color: #8a1c1c; }
  .health-empty { color: #6b4e12; }
  .summary { margin-top: 8px; color: #333; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>AgingWire research intelligence</h1>
      <div class="meta" id="generated"></div>
    </div>
  </div>

  <div class="grid" id="metrics"></div>

  <div class="controls">
    <input id="q" placeholder="Search stories, sources, topics">
    <select id="topic"><option value="">All topics</option></select>
    <select id="aud">
      <option value="">All opportunities</option>
      <option value="new">New this run</option>
      <option value="gap">Confirmed coverage gap</option>
      <option value="localizable">Localizable</option>
    </select>
  </div>

  <div id="items"></div>

  <div class="card">
    <h2>Pipeline health</h2>
    <div id="health"></div>
  </div>
</div>

<script>
let DATA = {};
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function flags(x) {
  const meta = x.raw_metadata || {};
  const out = [];
  if (meta.is_new) out.push('<span class="flag flag-new">New</span>');
  if (meta.coverage_state === 'gap') out.push('<span class="flag flag-gap">Coverage gap</span>');
  if (meta.coverage_state === 'unmonitored') out.push('<span class="flag flag-unmonitored">Coverage unknown</span>');
  return out.join(' ');
}

function render() {
  const q = document.querySelector('#q').value.toLowerCase();
  const t = document.querySelector('#topic').value;
  const a = document.querySelector('#aud').value;
  const rows = (DATA.evidence || []).filter(x => {
    const meta = x.raw_metadata || {};
    const text = [x.title, x.source_id, x.summary, ...(x.topics || [])].join(' ').toLowerCase();
    if (q && !text.includes(q)) return false;
    if (t && !(x.topics || []).includes(t)) return false;
    if (a === 'new' && !meta.is_new) return false;
    if (a === 'gap' && meta.coverage_state !== 'gap') return false;
    if (a === 'localizable' && !x.localizable && !(x.geographies || []).length) return false;
    return true;
  });
  document.querySelector('#items').innerHTML = rows.map(x => `
    <article class="card item">
      <div class="score">${x.score ?? 0}<span class="meta"> / 100</span></div>
      <h3><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h3>
      <div class="meta">${esc(x.source_id)} · ${esc(x.published_at ? x.published_at.slice(0, 10) : 'undated')} · B2B coverage ${x.b2b_coverage_count || 0} · B2C coverage ${x.b2c_coverage_count || 0}</div>
      <div class="tags">${flags(x)}${(x.topics || []).map(z => `<span class="tag">${esc(z)}</span>`).join('')}</div>
      ${x.summary ? `<div class="summary">${esc(x.summary.slice(0, 320))}${x.summary.length > 320 ? '…' : ''}</div>` : ''}
      ${(x.story_angles || []).length ? `<div class="angles"><strong>Angles</strong><ul>${x.story_angles.map(z => `<li>${esc(z)}</li>`).join('')}</ul></div>` : ''}
    </article>`).join('') || '<div class="card">No matches.</div>';
}

fetch('data/latest.json').then(r => r.json()).then(d => {
  DATA = d;
  document.querySelector('#generated').textContent = 'Generated ' + d.generated_at;
  const gaps = (d.evidence || []).filter(x => (x.raw_metadata || {}).coverage_state === 'gap').length;
  document.querySelector('#metrics').innerHTML = `
    <div class="card"><div class="metric">${d.evidence_count || 0}</div><div class="meta">evidence candidates</div></div>
    <div class="card"><div class="metric">${d.new_evidence_count || 0}</div><div class="meta">new since last run</div></div>
    <div class="card"><div class="metric">${gaps}</div><div class="meta">confirmed coverage gaps</div></div>
    <div class="card"><div class="metric">${d.monitored_publisher_count || 0}<span class="meta"> / ${d.registry_publisher_count || 0}</span></div><div class="meta">publishers with working feeds</div></div>`;
  const topics = [...new Set((d.evidence || []).flatMap(x => x.topics || []))].sort();
  document.querySelector('#topic').innerHTML += topics.map(x => `<option>${esc(x)}</option>`).join('');
  const all = [...(d.source_status || []), ...(d.media_status || [])];
  const errors = all.filter(x => x.status === 'error');
  const empties = all.filter(x => x.status === 'empty');
  const health = [
    ...errors.map(x => `<div class="health-error">Error — ${esc(x.source || x.publisher)}: ${esc(x.error)}</div>`),
    ...empties.map(x => `<div class="health-empty">Ran but returned nothing — ${esc(x.source || x.publisher)}</div>`)
  ];
  document.querySelector('#health').innerHTML = health.length ? health.join('') : 'All monitored collectors returned items.';
  render();
}).catch(() => {
  document.querySelector('#items').innerHTML = '<div class="card health-error">No pipeline output yet. Run the intelligence workflow first.</div>';
});

['q', 'topic', 'aud'].forEach(id => document.querySelector('#' + id).addEventListener('input', render));
</script>
</body>
</html>
