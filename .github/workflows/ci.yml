name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      # Config used to be covered on push by the daily collection workflow.
      # That trigger is gone (it cost a paid run per push), so the config
      # validation step below has to be reachable from here instead.
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: Validate configuration
        run: |
          python - <<'PY'
          import yaml
          config = yaml.safe_load(open("config/monitors.yml"))
          known = {"rss", "web", "census_acs", "bls_api", "federal_register", "cms_datasets"}
          ids = set()
          for monitor in config["evidence"]:
              assert monitor["id"] not in ids, f"duplicate monitor id: {monitor['id']}"
              ids.add(monitor["id"])
              assert monitor["method"] in known, f"unknown method: {monitor['method']}"
              if monitor["method"] in {"rss", "web"}:
                  assert monitor.get("url", "").startswith("http"), f"{monitor['id']} needs a url"
          assert not any(m["method"] == "senior_digest" for m in config["evidence"]), \
              "the senior-research-digest feed is deliberately out of scope"
          yaml.safe_load(open("config/topic_taxonomy.yml"))
          print(f"{len(config['evidence'])} monitors validated")
          PY
