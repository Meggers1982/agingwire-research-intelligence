name: Weekly AgingWire intelligence

on:
  schedule:
    - cron: '30 13 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agingwire-weekly-intelligence
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Build weekly rollup
        run: python -m agingwire_intel.weekly
      - name: Commit weekly digest
        run: |
          set -euo pipefail
          staging=$(mktemp -d)
          cp outputs/weekly-latest.md "$staging"/weekly-latest.md

          git config user.name "agingwire-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p outputs
          cp "$staging"/weekly-latest.md outputs/weekly-latest.md

          git add outputs/weekly-latest.md
          if git diff --cached --quiet; then
            echo "No weekly changes"
          else
            git commit -m "Update weekly research intelligence"
            git push origin main
          fi
