name: Weekly AgingWire intelligence

on:
  schedule:
    - cron: '30 13 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agingwire-weekly-intelligence
  cancel-in-progress: true

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -e .
      - name: Build weekly rollup
        run: python -m agingwire_intel.weekly
      - name: Commit weekly digest
        run: |
          git config user.name "agingwire-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/weekly-latest.md
          if git diff --cached --quiet; then
            echo "No weekly changes"
          else
            git commit -m "Update weekly research intelligence"
            git pull --rebase origin main
            git push origin main
          fi
