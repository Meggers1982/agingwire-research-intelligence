name: Replay an intelligence report

# The collectors read live APIs and cannot be asked for a past date, so a
# "rerun" of an older day means re-synthesising the evidence that day already
# collected. Useful after a prompt change: the report is rewritten, the
# underlying evidence is not re-gathered and does not drift.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Run to replay (YYYY-MM-DD), must exist in outputs/'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Shares the daily job's group: both commit to main, and a replay racing a
  # collection would lose one of them to the reset --hard in the commit step.
  group: agingwire-intelligence
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -e ".[dev,llm]"
      - name: Replay ${{ inputs.date }} and commit it
        run: |
          set -euo pipefail
          date="${{ inputs.date }}"
          git config user.name "agingwire-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"

          # The concurrency group keeps a replay from running beside a
          # collection, but the daily job can still land its commit between
          # this checkout and this push, and it did. Rebuild on top of whatever
          # is actually on main and try again, rather than pushing a commit
          # built on a main that has moved. Re-running the replay rather than
          # replanting the files is deliberate: index.json is derived from the
          # index already there, so it has to be rebuilt against the new one or
          # it would drop the run that just landed.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python -m agingwire_intel --replay "$date"

            git add "outputs/${date}.md" "docs/data/runs/${date}.json" docs/data/index.json
            if git diff --cached --quiet; then
              echo "Replay produced no change for ${date}"
              exit 0
            fi
            git commit -m "Replay the ${date} report"

            if git push origin main; then
              echo "Replayed ${date} on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected; main moved. Replaying on top of it."
          done

          echo "Could not land the ${date} replay after 3 attempts" >&2
          exit 1
