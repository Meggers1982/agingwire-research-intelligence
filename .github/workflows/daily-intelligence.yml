name: Daily AgingWire intelligence

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/daily-intelligence.yml'

permissions:
  contents: write

concurrency:
  group: agingwire-intelligence
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run intelligence pipeline
        run: python -m agingwire_intel
      - name: Commit generated intelligence
        run: |
          set -e
          rm -rf /tmp/agingwire-generated
          mkdir -p /tmp/agingwire-generated/docs/data /tmp/agingwire-generated/outputs
          cp docs/index.html /tmp/agingwire-generated/docs/index.html
          cp -a docs/data/. /tmp/agingwire-generated/docs/data/
          cp -a outputs/. /tmp/agingwire-generated/outputs/

          git config user.name "agingwire-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p docs/data outputs
          cp /tmp/agingwire-generated/docs/index.html docs/index.html
          cp -a /tmp/agingwire-generated/docs/data/. docs/data/
          cp -a /tmp/agingwire-generated/outputs/. outputs/

          git add outputs docs/index.html docs/data
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update daily research intelligence"
            git push origin main
          fi
