name: Daily AgingWire intelligence

# Collection runs on a schedule, or by hand. It deliberately does NOT run on
# push: this job is a full collection that spends Anthropic and SerpAPI money
# and mutates state/seen.json, and it used to fire on every push touching
# src/, config/ or tests/. Roughly forty unrecorded runs happened in three
# days that way, and each one consumed the is_new flag before the scheduled
# run that actually gets published could see it -- new_evidence_count was 0 on
# every published run as a result, and is_new feeds both score_evidence() and
# _angles(). ci.yml covers pushes with lint and tests; use the deploy workflow
# to publish a dashboard change without collecting.
#
# Collection is daily; the feature pitch is three days a week. The evidence adds
# a few items a weekday (0, 0, 2, 5 across 09-06..09-09), so a daily pitch was
# either retelling the last one or straining a thin day into a story. The second
# cron collects without pitching, which also skips the Anthropic call. The days
# are named in synthesis.PITCH_NOTE and the README -- change all three together.
on:
  schedule:
    - cron: '15 12 * * 1,3,5'    # collect and pitch
    - cron: '15 12 * * 0,2,4,6'  # collect only
  workflow_dispatch:
    inputs:
      pitch:
        description: Write the feature pitch on this run
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: agingwire-intelligence
  # Never cancel a run that commits data: a push used to be able to kill the
  # scheduled collection mid-flight and silently lose that day.
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Collection was a five-minute job until discovery grew three fallback
    # routes; the first run after a cache refill took 23m21s against a 30-minute
    # cap. Losing a day of data to a timeout costs more than the extra minutes.
    timeout-minutes: 45
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      # Optional: when present the editorial sections are written by Claude
      # instead of being derived from the run data. Absent is a supported mode.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Optional: Google Trends demand scoring and Google News coverage checks.
      # Absent, the run scores demand neutral and skips the news lookups.
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -e ".[dev,llm]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run intelligence pipeline
        env:
          COLLECT_ONLY: ${{ github.event.schedule == '15 12 * * 0,2,4,6' || (github.event_name == 'workflow_dispatch' && !inputs.pitch) }}
        run: |
          if [ "$COLLECT_ONLY" = "true" ]; then
            python -m agingwire_intel --no-pitch
          else
            python -m agingwire_intel
          fi
      - name: Commit generated intelligence
        run: |
          set -euo pipefail
          staging=$(mktemp -d)
          mkdir -p "$staging"/docs/data "$staging"/outputs "$staging"/state
          cp docs/index.html "$staging"/docs/index.html
          # docs/data carries the run database (index.json + runs/), which is
          # the dashboard's history -- it must survive the reset below.
          cp -a docs/data/. "$staging"/docs/data/
          cp -a outputs/. "$staging"/outputs/
          [ -d state ] && cp -a state/. "$staging"/state/ || true

          git config user.name "agingwire-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p docs/data outputs state
          cp "$staging"/docs/index.html docs/index.html
          cp -a "$staging"/docs/data/. docs/data/
          cp -a "$staging"/outputs/. outputs/
          cp -a "$staging"/state/. state/ || true

          git add outputs docs/index.html docs/data docs/vendor state
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update daily research intelligence"
            git push origin main
          fi
