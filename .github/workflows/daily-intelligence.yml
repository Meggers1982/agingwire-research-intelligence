name: Daily AgingWire intelligence

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agingwire-intelligence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -e .
      - name: Run intelligence pipeline
        run: python -m agingwire_intel
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit generated intelligence
        run: |
          git config user.name "agingwire-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs docs/index.html docs/data || true
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update daily research intelligence"
            git push
          fi
